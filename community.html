</head>
<body>
<div class="page">
<header class="topbar">
<div class="topbar-inner">
<a href="index.html" class="brand"><span>⚽</span><span>世界杯胜率预测台</span></a>

</nav>
<button class="hamburger" id="hamburger" aria-label="菜单"><span></span><span></span><span></span></button>
</div>
</header>
<div class="mobile-nav" id="mobileNav">
<a href="index.html">预测器</a>
<a href="live.html">实时赛况</a>
<a href="teams.html">球队百科</a>
<a href="ranking.html">夺冠热榜</a>
<a href="community.html">球迷社区</a>
<span id="authAreaMobile" class="auth-area"></span>
</div>

<main>
<div class="shell">
<section id="community" class="section community-section">
  <div class="community-header">
    <h2>🏟️ 球迷社区</h2>
    <button class="btn-new-post" id="btnNewPost">+ 发帖</button>
  </div>
  <div class="community-filters" id="communityFilters">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="discussion">💬 讨论</button>
    <button data-filter="prediction">🎯 预测</button>
    <button data-filter="news">📰 资讯</button>
  </div>
  <div class="sort-bar" id="sortBar">
    <button class="active" data-sort="latest">最新</button>
    <button data-sort="hot">最热</button>
    <button data-sort="pinned">置顶</button>
  </div>
  <div id="postList">
    <div style="text-align:center;padding:40px;color:var(--muted)">加载中...</div>
  </div>
  <div id="loadMorePosts" style="text-align:center;padding:16px;display:none">
    <button style="background:var(--panel-2);color:var(--muted);padding:8px 24px;border-radius:8px;cursor:pointer">加载更多</button>
  </div>
</section>
</div>
</main>
</div>

<nav class="tab-bar" id="tabBar">
<a href="index.html"><span class="tab-icon">🏠</span><span class="tab-label">首页</span></a>

<a href="teams.html"><span class="tab-icon">📖</span><span class="tab-label">百科</span></a>
</nav>

<!-- 发帖弹窗 -->
<div class="modal-overlay" id="newPostModal">
  <div class="modal-card" style="position:relative">
    <span class="btn-close" id="closeNewPost">&times;</span>
    <h3>发帖</h3>
    <input type="text" id="postTitle" placeholder="标题" maxlength="100">
    <textarea id="postContent" placeholder="说说你的看法..." maxlength="2000"></textarea>
    <select id="postCategory">
      <option value="discussion">💬 讨论</option>
      <option value="prediction">🎯 预测</option>
      <option value="news">📰 资讯</option>
    </select>
    <input type="text" id="postMatchKey" placeholder="关联比赛（如：阿根廷_vs_巴西，可留空）">
    <button class="btn-submit" id="submitPost">发布</button>
  </div>
</div>

<!-- 帖子详情弹窗 -->
<div class="modal-overlay" id="postDetailModal">
  <div class="modal-card" style="position:relative;max-width:640px">
    <span class="btn-close" id="closePostDetail">&times;</span>
    <div class="post-detail">
      <h3 id="detailPostTitle"></h3>
      <div class="post-meta" id="detailPostMeta"></div>
      <div class="post-body" id="detailPostBody"></div>
      <div class="post-actions" id="detailPostActions"></div>
    </div>
    <div id="replyList"></div>
    <div class="reply-input-area" id="replyInputArea">
      <span class="reply-target" id="replyTarget" style="display:none"></span>
      <input type="text" id="replyInput" placeholder="写下你的回复..." maxlength="500">
      <button id="submitReply">回复</button>
    </div>
  </div>
</div>

<!-- 登录弹窗由 nav.js 动态注入 -->

<script defer src="js/config.js"></script>
<script defer src="js/utils.js"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/avatars.js"></script>
<script defer src="js/content-filter.js"></script>
<script defer src="js/notifications.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/nav.js"></script>
<script defer src="js/community.js"></script>

<!-- ================= 海报分享功能 ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="js/share.js"></script>

<!-- 隐藏海报模板 -->
<div id="share-poster-tpl" style="position:absolute;left:-9999px;top:-9999px;width:375px;background:linear-gradient(160deg,#0d2818 0%,#1a472a 60%,#0d2818 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;padding:36px 24px 28px;box-sizing:border-box;">
  <div style="text-align:center;margin-bottom:22px;">
    <div style="font-size:28px;margin-bottom:6px;">⚽</div>
    <div style="font-size:20px;font-weight:700;color:#ffd700;letter-spacing:2px;">世界杯胜率预测台</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:3px;margin-top:4px;">2026 FIFA WORLD CUP</div>
  </div>
  <div id="share-poster-content" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,215,0,0.3);border-radius:12px;padding:18px 16px;margin-bottom:22px;min-height:80px;">
    <div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:8px;">来自球迷社区</div>
    <div id="share-poster-title" style="font-size:16px;font-weight:600;line-height:1.5;color:#fff;"></div>
    <div id="share-poster-body" style="font-size:13px;color:rgba(255,255,255,0.75);margin-top:8px;line-height:1.6;"></div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,0.15);padding-top:18px;">
    <div>
      <div style="font-size:13px;font-weight:600;color:#ffd700;margin-bottom:4px;">扫码参与预测</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.5);">和球迷一起对线 ⚽</div>
    </div>
    <div style="background:#fff;padding:5px;border-radius:8px;">
      <img id="share-poster-qr" src="" width="72" height="72" alt="QR" style="display:block;">
    </div>
  </div>
</div>

<!-- 分享预览弹窗 -->
<div id="share-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);z-index:99999;justify-content:center;align-items:center;flex-direction:column;">
  <p style="color:#fff;margin-bottom:14px;font-size:14px;text-align:center;">✨ 海报已生成！长按图片保存到相册</p>
  <div id="share-img-wrap" style="max-width:88vw;text-align:center;"></div>
  <div style="margin-top:18px;display:flex;gap:12px;">
    <button onclick="window.ShareModule&&window.ShareModule.download()" style="padding:10px 24px;background:#ffd700;color:#0d2818;border:none;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;">⬇ 保存图片</button>
    <button onclick="window.ShareModule&&window.ShareModule.close()" style="padding:10px 24px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer;">关闭</button>
  </div>
  <p style="color:rgba(255,255,255,0.4);font-size:11px;margin-top:12px;">iOS：长按图片 → 存储到"照片"</p>
</div>
<!-- ================= 海报分享功能结束 ================= -->
</body>
</html>
